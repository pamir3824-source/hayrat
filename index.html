.frame{position:relative;padding:12px;border-radius:34px;border:1px solid var(--line);background:var(--glass);box-shadow:0 40px 90px -30px #000}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:24px;filter:grayscale(.15) contrast(1.03)}

.bar{display:flex;gap:6px;padding:12px 14px}.bar i{width:9px;height:9px;border-radius:50%;background:#3a3a3d}
.mock{position:absolute;inset:36px 0 0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 30%,#2a2a2d,#0b0b0b 70%)}

.g3{grid-template-columns:repeat(3,1fr)}
.cts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:40px 0}
.ct{padding:20px;text-align:center;transition:transform .3s,border-color .3s}.ct:hover{transform:translateY(-4px);border-color:#fff6}
.ct small{display:block;color:var(--mu);font-size:12px;margin-top:4px;word-break:break-all}
form{padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.f{display:flex;flex-direction:column;gap:6px}.f.w{grid-column:1/-1}
label{font-size:13px;color:#cfcfd4}

select option{background:#111}

textarea{min-height:120px;resize:vertical}
.err{color:#ff8f8f;font-size:12.5px;min-height:0}.bad{border-color:#ff8f8f!important}
.ok{display:none;padding:40px;text-align:center}.ok h3{font-size:28px;margin:10px 0}.ok p{color:var(--mu);max-width:480px;margin:0 auto 18px}
footer{padding:36px 0;border-top:1px solid var(--line);color:var(--mu);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}.rv.in{opacity:1;transform:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:999px;z-index:99;transition:.3s;pointer-events:none;font-size:14px;background:rgba(20,20,20,.9);border:1px solid var(--line)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
 section{padding:80px 0}
 .burger{display:block}
 nav{position:absolute;top:100%;left:12px;right:12px;margin-top:8px;padding:12px;border-radius:20px;border:1px solid var(--line);background:rgba(14,14,14,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none}
 nav.open{display:block}nav ul{flex-direction:column;gap:0}nav a{display:block;padding:14px;font-size:16px}
 .hero .wrap,.about,.works{grid-template-columns:1fr}
 .photo{order:-1;width:min(78%,320px)}

}
@media(max-width:600px){.g5,.g3,form{grid-template-columns:1fr}.wrap{padding:0 18px}.btn{width:100%}.cta{flex-direction:column}.chips{grid-template-columns:1fr 1fr}form{padding:22px}}

/* ===== PREMIUM REDESIGN ===== */
:root{--dk:#08090B;--gr:#17191D;--ch:#25282D;--ww:#F5F4F0;--sg:#E8E8E5;--bg:#08090B;--mu:#85878C;--be:#C7BDAE}
section{overflow:hidden}.wrap{position:relative;z-index:1}
section::before{content:"";position:absolute;left:0;right:0;top:-1px;height:140px;background:linear-gradient(var(--prev,transparent),transparent);pointer-events:none;z-index:0}
#about{--prev:#101215;background:var(--ww)}#skills{--prev:var(--ww);background:radial-gradient(circle,rgba(23,25,29,.07) 1px,transparent 1.5px) 0 0/26px 26px,var(--sg)}
#works{--prev:var(--sg);background:radial-gradient(800px at 90% 0,rgba(255,255,255,.06),transparent),#111316}
#services{--prev:#111316;background:linear-gradient(180deg,#fff,#EDECE8)}
#contact{--prev:#EDECE8;background:radial-gradient(600px at 88% 8%,rgba(255,255,255,.09),transparent),radial-gradient(520px at 8% 92%,rgba(199,189,174,.12),transparent),var(--gr)}
footer{background:var(--dk)}
.dec{position:absolute;right:-180px;top:12%;width:520px;height:520px;border-radius:50%;border:1px solid rgba(23,25,29,.13);pointer-events:none}
.dec::after{content:"";position:absolute;inset:60px;border-radius:50%;border:1px solid rgba(23,25,29,.09)}
.dec.dk{border-color:rgba(255,255,255,.1);background:radial-gradient(closest-side,rgba(255,255,255,.05),transparent)}.dec.dk::after{border-color:rgba(255,255,255,.07)}
/* hero */
.hero{background:radial-gradient(900px 600px at 15% 0,var(--ch),transparent 65%),#101215}
.hero::before{content:"";position:absolute;right:6%;top:8%;width:50%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);filter:blur(30px);animation:breathe 7s ease-in-out infinite;z-index:0}
.blob{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.b1{width:380px;height:380px;left:6%;bottom:6%;background:rgba(255,255,255,.1);animation:drift 16s ease-in-out infinite alternate}
.b2{width:300px;height:300px;left:42%;top:4%;background:rgba(199,189,174,.14);animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,-50px) scale(1.15)}}@keyframes breathe{50%{opacity:.55;transform:scale(1.08)}}
.hero h1.in{animation:trk 1.5s cubic-bezier(.2,.7,.2,1) backwards}@keyframes trk{from{letter-spacing:.14em;filter:blur(8px)}}
.hc>.rv:nth-child(1){transition-delay:.05s}.hc>.rv:nth-child(2){transition-delay:.2s}.hc>.rv:nth-child(3){transition-delay:.35s}.hc>.rv:nth-child(4){transition-delay:.5s}.hc>.rv:nth-child(5){transition-delay:.65s}
/* reveal variants */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}.w>span{display:inline-block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.7,.2,1)}.in .w>span{transform:none}
.fl{transform:translateX(-50px)}.fr{transform:translateX(50px)}
.st{opacity:0}.st.in{opacity:1;animation:up .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*100ms)}
@keyframes up{from{opacity:0;transform:translateY(34px)}}@keyframes pop{from{opacity:0;transform:scale(.88) rotate(-2deg)}}@keyframes rise{from{opacity:0;transform:translateY(80px) scale(.96)}}@keyframes blurin{from{opacity:0;filter:blur(12px);transform:translateY(16px)}}
#skills .st.in{animation-name:pop}#works .st.in{animation-name:rise;animation-duration:1s}#contact .st.in{animation-name:blurin}
/* light surfaces */
.lt{color:#0c0d0f}.lt h2{color:#0c0d0f}.lt .eyebrow{color:var(--mu)}.lt .lead,.lt .card p,.lt .chip span{color:#55585e}.lt .about p{color:#2a2c30}
.lt .glass{background:rgba(255,255,255,.72);border-color:rgba(23,25,29,.09);box-shadow:0 18px 40px -24px rgba(23,25,29,.4)}

.lt .card:hover,.lt .chip:hover{border-color:rgba(23,25,29,.3);box-shadow:0 32px 60px -26px rgba(23,25,29,.45),0 0 0 4px rgba(255,255,255,.7)}

header{transition:background .4s,border-color .4s}header.sc{background:rgba(8,9,11,.82)}

#about .eyebrow::after{background:rgba(255,255,255,.5)}
#skillGrid>:nth-child(1){border-top-color:rgba(255,255,255,.4)}
@media(max-width:900px){#about,#skills,#works,#services,#contact{--ov:rgba(8,9,11,.52)}}

/* ===== SCROLL EXPERIENCE ===== */
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
#about::after,#skills::after,#works::after,#services::after,#contact::after{content:"";position:absolute;inset:-12% 0;background:var(--bgi) center/cover no-repeat;transform:translate3d(0,var(--py,0px),0) scale(var(--sc,1));will-change:transform;z-index:0;pointer-events:none}
section::before{z-index:1;height:180px}.dec{z-index:1}
#prog{position:fixed;right:clamp(6px,1.3vw,20px);top:50%;transform:translateY(-50%);height:34vh;width:2px;border-radius:2px;background:rgba(255,255,255,.14);z-index:60;pointer-events:none}
#prog i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(#fff,#cfcfd4);box-shadow:0 0 10px rgba(255,255,255,.5);transform-origin:top;transform:scaleY(var(--p,0))}
.rv p{opacity:0;transform:translateY(16px);transition:opacity 1s cubic-bezier(.2,.7,.2,1) .3s,transform 1s cubic-bezier(.2,.7,.2,1) .3s}
.rv.in p{opacity:1;transform:none}.rv.in p:nth-of-type(2){transition-delay:.45s}.rv.in p:nth-of-type(3){transition-delay:.6s}
@media(prefers-reduced-motion:reduce){.rv p{opacity:1;transform:none}#about::after,#skills::after,#works::after,#services::after,#contact::after{transform:none}}

/* ===== STACKING TRANSITION ===== */
main>section{isolation:isolate}
.shade{position:absolute;inset:0;background:#040506;opacity:0;pointer-events:none;z-index:8}
html.stk #services{border-radius:28px 28px 0 0;box-shadow:0 -26px 70px -20px rgba(0,0,0,.7)}
html.stk #skills,html.stk #services{will-change:transform}
@media(max-width:900px){html.stk #services{border-radius:20px 20px 0 0}}
html.gs #about .rv p{transition:none}
.cglow{position:absolute;left:50%;top:46%;width:80vmax;height:80vmax;margin:-40vmax 0 0 -40vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.13),rgba(199,189,174,.05) 55%,transparent);pointer-events:none;z-index:0;opacity:0}
html:not(.gs) .cglow{opacity:.7}

/* ===== SHADER BACKGROUND + GLASS ICONS ===== */
.shcv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
html.sh #about::after,html.sh #skills::after,html.sh #works::after,html.sh #services::after,html.sh #contact::after{inset:0;background:rgba(7,8,10,.56);transform:none;will-change:auto}
html.sh .cglow{z-index:1}
.ic,#skillGrid>.card .ic,#svcGrid>.card .ic{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.3);color:#fff;-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 26px -12px rgba(0,0,0,.65)}

/* ===== LIQUID GLASS ===== */
:root{--sh:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.2) 48%,rgba(255,255,255,.05) 54%,transparent 64%);--ease:cubic-bezier(.2,.7,.2,1)}
.glass,.ic,.pill{position:relative}
/* световой край (specular rim) */
.glass::after,.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;opacity:.75;transition:opacity .5s;background:linear-gradient(135deg,rgba(255,255,255,.75),rgba(255,255,255,.05) 28%,rgba(255,255,255,0) 58%,rgba(255,255,255,.42));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass:hover::after,.card:hover .ic::after{opacity:1}
/* 1. LIQUID — глянцевое стекло с отражениями: карточки навыков */
#skillGrid>.card{background-color:rgba(255,255,255,.02);background-image:var(--sh),radial-gradient(120% 75% at 16% -12%,rgba(255,255,255,.36),rgba(255,255,255,0) 58%),linear-gradient(165deg,rgba(255,255,255,.12),rgba(255,255,255,.02) 46%,rgba(255,255,255,.1));background-size:300% 100%,100% 100%,100% 100%;background-position:100% 0,0 0,0 0;background-repeat:no-repeat;-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.08);backdrop-filter:blur(16px) saturate(190%) brightness(1.08);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 8px rgba(255,255,255,.1),inset 0 0 26px rgba(255,255,255,.06),0 32px 60px -30px rgba(0,0,0,.85);transition:transform .35s,border-color .4s,box-shadow .4s,background-position 1.4s var(--ease),backdrop-filter .5s}
#skillGrid>.card:hover{background-position:0 0,0 0,0 0;border-color:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(12px) saturate(210%) brightness(1.12);backdrop-filter:blur(12px) saturate(210%) brightness(1.12);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),inset 0 -2px 8px rgba(255,255,255,.16),inset 0 0 34px rgba(255,255,255,.1),0 36px 70px -30px rgba(0,0,0,.85),0 0 46px -14px rgba(255,255,255,.3)}
/* 2. FROSTED — матовое стекло: услуги, форма */
#svcGrid>.card,#contact .glass.rv{background-color:rgba(255,255,255,.03);background-image:var(--sh),linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.035) 55%,rgba(255,255,255,.09));background-size:300% 100%,100% 100%;background-position:100% 0,0 0;background-repeat:no-repeat;-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -22px 34px -28px rgba(255,255,255,.14),0 26px 54px -28px rgba(0,0,0,.8);transition:transform .35s,border-color .4s,box-shadow .4s,background-position 1.4s var(--ease),backdrop-filter .5s}
#contact .glass.rv{transition:opacity .8s ease,transform .8s ease,border-color .4s,box-shadow .4s,background-position 1.4s var(--ease)}
#svcGrid>.card:hover{background-position:0 0,0 0;border-color:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -22px 34px -28px rgba(255,255,255,.2),0 32px 60px -28px rgba(0,0,0,.85),0 0 40px -16px rgba(255,255,255,.22)}
/* 3. CRYSTAL — прозрачное стекло с яркими гранями: проекты */
.work{background-color:rgba(255,255,255,.015);background-image:var(--sh),linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.01) 50%,rgba(255,255,255,.07));background-size:300% 100%,100% 100%;background-position:100% 0,0 0;background-repeat:no-repeat;-webkit-backdrop-filter:blur(8px) saturate(180%) brightness(1.1);backdrop-filter:blur(8px) saturate(180%) brightness(1.1);border-color:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 1px 0 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.05),0 28px 60px -26px rgba(0,0,0,.8);transition:transform .25s ease-out,border-color .4s,box-shadow .4s,background-position 1.4s var(--ease)}
.work:hover{background-position:0 0,0 0;border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 1px 0 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.08),0 32px 70px -26px rgba(0,0,0,.8),0 0 64px -18px rgba(255,255,255,.34)}
/* 4. SOFT — мягкое стекло с деликатным свечением: «Обо мне», контакты, плашка */
.chip,#contact .ct,.pill{background-color:rgba(255,255,255,.04);background-image:var(--sh),radial-gradient(90% 90% at 50% 0%,rgba(255,255,255,.15),rgba(255,255,255,0) 70%);background-size:300% 100%,100% 100%;background-position:100% 0,0 0;background-repeat:no-repeat;-webkit-backdrop-filter:blur(20px) saturate(135%);backdrop-filter:blur(20px) saturate(135%);border-color:rgba(255,255,255,.13);box-shadow:inset 0 0 28px rgba(255,255,255,.05),inset 0 1px 0 rgba(255,255,255,.24),0 0 32px -10px rgba(255,255,255,.12),0 20px 44px -26px rgba(0,0,0,.7);transition:transform .35s,border-color .4s,box-shadow .4s,background-position 1.4s var(--ease)}
.chip:hover,#contact .ct:hover{background-position:0 0,0 0;border-color:rgba(255,255,255,.28);box-shadow:inset 0 0 34px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.4),0 0 44px -10px rgba(255,255,255,.22),0 22px 46px -26px rgba(0,0,0,.7)}
/* иконки — Crystal */
.ic,#skillGrid>.card .ic,#svcGrid>.card .ic{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.03) 60%,rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.34);color:#fff;-webkit-backdrop-filter:blur(10px) saturate(190%) brightness(1.12);backdrop-filter:blur(10px) saturate(190%) brightness(1.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -6px 10px -6px rgba(255,255,255,.18),0 14px 28px -12px rgba(0,0,0,.7)}
.ic::before{content:"";position:absolute;top:3px;left:5px;width:58%;height:36%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none;z-index:2}
/* шапка и мобильное меню — Frosted */
header{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 36px -18px rgba(0,0,0,.7)}
header.sc{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05)),rgba(8,9,11,.35)}
nav a.act{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px -8px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
